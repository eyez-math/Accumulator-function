<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הפונקציה הצוברת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathlive@0.109.2/mathlive.min.js"></script>
<style>
  :root{
    --bg:#E9EEF2; --card:#FFFFFF; --ink:#17212B; --muted:#5B6875; --line:#D5DCE3;
    --grid:#EEF2F5; --axis:#8C98A4;
    --f:#1F5FA8; --F:#8A3FA0; --add:#1E9E6A; --sub:#D2414E; --a:#E0861A;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans Hebrew",system-ui,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.5}
  .ltr{direction:ltr;unicode-bidi:isolate}

  /* כל האפליקציה במסך אחד */
  .app{height:100vh;max-width:1600px;margin:0 auto;padding:8px 16px 12px;
    display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px}
  h1{font-size:1.2rem;margin:0;font-weight:700;line-height:1.3}

  /* שורת שליטה עליונה */
  .ctrlbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px}
  .group{display:flex;align-items:center;gap:8px}
  .lbl{color:var(--muted);font-size:.92rem;white-space:nowrap}
  select,.num-in{font:inherit;font-size:.95rem;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .num-in{width:4.4em;direction:ltr;text-align:center}
  .num-in:disabled{background:#F2F4F6;color:var(--muted)}
  .fxbox{display:flex;align-items:center;gap:8px;flex:1 1 300px;min-width:260px;max-width:520px;position:relative}
  .fxl{direction:ltr;unicode-bidi:isolate;font-weight:600;white-space:nowrap}
  math-field,.fx-fallback{flex:1;min-width:0;font-size:1.15rem;border:1px solid var(--line);border-radius:8px;
    padding:2px 8px;background:#fff;direction:ltr}
  math-field:focus-within{outline:3px solid var(--a);outline-offset:1px}
  .err{position:absolute;top:100%;right:0;font-size:.82rem;color:var(--sub);white-space:nowrap;z-index:3;background:var(--bg);padding:0 4px}
  .err:empty{display:none}
  .toggles{margin-inline-start:auto}
  .chip{font:inherit;font-size:.9rem;border:1px solid var(--line);background:#fff;
    border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--ink);white-space:nowrap}
  .chip:hover{border-color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip:disabled{opacity:.45;cursor:default}
  .btn{font:inherit;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:5px 16px;cursor:pointer;white-space:nowrap}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}

  /* גרפים – שני פאנלים זהים */
  .graphs{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
  .panel{flex:1 1 0;min-height:0;display:flex;flex-direction:column;padding:6px 14px 2px}
  .panel-head{height:62px;flex:none;display:flex;align-items:center;gap:20px;overflow:hidden}
  .panel-head .name{font-weight:700;font-size:1.12rem;white-space:nowrap}
  .panel-head .formula{direction:ltr;unicode-bidi:isolate;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-align:right}
  .is-f .name,.is-f .formula{color:var(--f)}
  .is-F .name,.is-F .formula{color:var(--F)}
  .plot-wrap{flex:1;min-height:110px;position:relative}
  svg.plot{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;direction:ltr;user-select:none}
  .plot text{font-family:inherit;font-size:12px;fill:var(--muted)}
  .plot .tick{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
  .plot .axname{font-style:italic;font-size:14px;fill:var(--ink)}
  .gl{stroke:var(--grid);stroke-width:1}
  .axis{stroke:var(--axis);stroke-width:1.3}
  .fcurve{fill:none;stroke:var(--f);stroke-width:3;stroke-linejoin:round}
  .Ffull{fill:none;stroke:var(--F);stroke-width:2;stroke-dasharray:6 6;opacity:.4}
  .Ftrace{fill:none;stroke:var(--F);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
  .addA{fill:var(--add);fill-opacity:.32}
  .subA{fill:url(#hatch)}
  .xline{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 4;opacity:.5}
  .featl{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 4;opacity:.6}
  .strip{fill:var(--ink);fill-opacity:.16;stroke:var(--ink);stroke-width:1.2}
  .tan{stroke:var(--F);stroke-width:2;opacity:.85}

  /* כרטיסי החישוב */
  .calc{display:flex;gap:10px;flex:none}
  .ccard{flex:1 1 0;min-width:0;padding:8px 14px 6px}
  .ccard.main{flex-grow:.75} .ccard.area{flex-grow:1.1} .ccard.wide{flex-grow:1.7} .ccard.rel{flex-grow:1.1}
  .cl{display:flex;gap:10px;align-items:center;font-size:.85rem;color:var(--muted);white-space:nowrap;height:20px}
  .cv{direction:ltr;unicode-bidi:isolate;text-align:center;white-space:nowrap;overflow:hidden;height:44px;line-height:44px}
  .warn{color:var(--ink);background:#FFF6E8;border-right:3px solid var(--a);padding:0 8px;border-radius:3px}
  .warn:empty{display:none}

  /* סליידרים */
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;padding:6px 16px;flex:none}
  .sl{display:flex;align-items:center;gap:12px;flex:1 1 280px}
  .sl label{font-weight:700;font-size:1.1rem}
  .sl output{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem;direction:ltr;unicode-bidi:isolate;text-align:left;min-width:3.2em}
  .ca{color:var(--a)}
  #a0{border-color:var(--a);color:var(--a)}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:34px;background:transparent;margin:0;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:#D5DCE3}
  input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#D5DCE3}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
    background:var(--ink);border:3px solid #fff;box-shadow:0 0 0 1px var(--ink);margin-top:-9px}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 0 0 1px var(--ink)}
  #as::-webkit-slider-thumb{background:var(--a);box-shadow:0 0 0 1px var(--a)}
  #as::-moz-range-thumb{background:var(--a);box-shadow:0 0 0 1px var(--a)}
  .btns{display:flex;gap:8px}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--a);outline-offset:2px}

  @media (max-width:820px), (max-height:540px){
    .app{height:auto}
    .graphs{flex:none}
    .panel{flex:none}
    .ccard{flex:none}
    .plot-wrap{flex:none;height:250px}
    .panel-head{height:auto;min-height:44px;flex-wrap:wrap;gap:4px 14px}
    .panel-head .formula{text-align:right;overflow-x:auto;flex-basis:100%}
    .calc{flex-direction:column}
    .toggles{margin-inline-start:0}
    .fxbox{max-width:none}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#D2414E" fill-opacity=".13"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#D2414E" stroke-width="3" stroke-opacity=".7"/>
    </pattern>
  </defs>
</svg>

<main class="app">
  <h1>הפונקציה הצוברת</h1>

  <div class="ctrlbar">
    <div class="group">
      <label class="lbl" for="ex">דוגמה</label>
      <select id="ex"></select>
    </div>
    <div class="fxbox">
      <span class="fxl">f(x) =</span>
      <math-field id="mf" math-virtual-keyboard-policy="auto" aria-label="הקלדת פונקציה"></math-field>
      <button class="btn" id="show">הצג</button>
      <span class="err" id="err" role="alert"></span>
    </div>
    <div class="group">
      <span class="lbl">טווח x:</span>
      <input class="num-in" type="number" id="dMin" step="0.5" aria-label="תחילת הטווח">
      <span class="lbl">עד</span>
      <input class="num-in" type="number" id="dMax" step="0.5" aria-label="סוף הטווח">
      <button class="chip" id="fit" title="מחזיר את טווח ברירת המחדל, בתחום שבו הפונקציה מוגדרת">התאם גרף</button>
    </div>
    <div class="group toggles">
      <button class="chip" id="tFull" aria-pressed="true">F המלא</button>
      <button class="chip" id="tStrip" aria-pressed="false">משיק</button>
      <button class="chip" id="tMarks" aria-pressed="false">קיצון ופיתול</button>
    </div>
  </div>

  <section class="graphs" id="graphs">
    <div class="card panel is-f">
      <div class="panel-head"><span class="name">הפונקציה המקורית</span><span class="formula" id="fTex"></span></div>
      <div class="plot-wrap"><svg class="plot" id="pf" role="img" aria-label="גרף הפונקציה f והשטח שמתחתיו"></svg></div>
    </div>
    <div class="card panel is-F">
      <div class="panel-head"><span class="name">הפונקציה הצוברת</span><span class="formula" id="FTex"></span></div>
      <div class="plot-wrap"><svg class="plot" id="pF" role="img" aria-label="גרף הפונקציה הצוברת F"></svg></div>
    </div>
  </section>

  <section class="calc" aria-label="החישוב">
    <div class="card ccard main"><div class="cl">ערך מצטבר</div><div class="cv" id="cMain"></div></div>
    <div class="card ccard area"><div class="cl">לפי שטחים <span class="warn" id="note"></span></div><div class="cv" id="cArea"></div></div>
    <div class="card ccard wide" id="formulaCard"><div class="cl">לפי הנוסחה של F</div><div class="cv" id="cFormula"></div></div>
    <div class="card ccard rel"><div class="cl">הקשר בין F ל־f</div><div class="cv" id="cRel"></div></div>
  </section>

  <section class="card controls">
    <div class="sl"><label for="as" class="ca">a</label><input type="range" id="as" dir="ltr"><output id="av" class="ca"></output>
      <button class="chip" id="a0">a = 0</button></div>
    <div class="sl"><label for="xs">x</label><input type="range" id="xs" dir="ltr"><output id="xv"></output></div>
    <div class="btns">
      <button class="btn" id="play">▶ הפעל צבירה</button>
      <button class="btn ghost" id="reset">איפוס</button>
    </div>
  </section>
</main>

<script>
/* ===== קריאת ביטוי מתמטי (LaTeX מהמקלדת המתמטית, או טקסט רגיל) והפיכתו לפונקציה ===== */
const FUNCS = {
  sin:Math.sin, cos:Math.cos, tan:Math.tan, ln:Math.log, log:Math.log10, exp:Math.exp,
  arcsin:Math.asin, arccos:Math.acos, arctan:Math.atan, sqrt:Math.sqrt, abs:Math.abs,
};
function tokenize(src){
  const toks = []; let i = 0;
  const SKIP = new Set(['left','right','mleft','mright','bigl','bigr','Bigl','Bigr','big','Big','displaystyle','textstyle','mathrm','mathit','operatorname','placeholder']);
  while(i < src.length){
    const ch = src[i];
    if(/\s/.test(ch)){ i++; continue; }
    if(ch === '\\'){
      let j = i+1;
      if(/[a-zA-Z]/.test(src[j] || '')){
        while(/[a-zA-Z]/.test(src[j] || '')) j++;
        const name = src.slice(i+1, j); i = j;
        if(name === 'operatorname' || name === 'mathrm' || name === 'text'){
          // \operatorname{sin} → sin ; \mathrm{e} → e
          const m = src.slice(i).match(/^\s*\{([a-zA-Z]+)\}/);
          if(m){ i += m[0].length; pushWord(m[1]); continue; }
          continue;
        }
        if(name === 'placeholder'){ const m = src.slice(i).match(/^\s*(\[[^\]]*\])?\s*\{\}/); if(m) i += m[0].length; continue; }
        if(SKIP.has(name)) continue;
        if(name === 'vert' || name === 'lvert' || name === 'rvert'){ toks.push({t:'|'}); continue; }
        if(name === 'cdot' || name === 'times' || name === 'ast'){ toks.push({t:'*'}); continue; }
        if(name === 'div'){ toks.push({t:'/'}); continue; }
        if(name === 'pi'){ toks.push({t:'num', v:Math.PI}); continue; }
        if(name === 'exponentialE'){ toks.push({t:'num', v:Math.E}); continue; }
        if(name === 'frac' || name === 'dfrac' || name === 'tfrac'){ toks.push({t:'frac'}); continue; }
        if(name === 'sqrt'){ toks.push({t:'sqrt'}); continue; }
        if(FUNCS[name]){ toks.push({t:'fn', v:name}); continue; }
        throw new Error('פקודה לא מוכרת: \\' + name);
      }
      // \, \; \! \  וכדומה – רווחים
      if(src[j] === '{' || src[j] === '}'){ toks.push({t: src[j] === '{' ? '(' : ')'}); i = j+1; continue; }
      i = j+1; continue;
    }
    if(/[0-9.]/.test(ch)){
      let j = i; while(/[0-9.]/.test(src[j] || '')) j++;
      const v = parseFloat(src.slice(i,j)); if(isNaN(v)) throw new Error('מספר לא תקין');
      toks.push({t:'num', v}); i = j; continue;
    }
    if(/[a-zA-Z]/.test(ch)){
      let j = i; while(/[a-zA-Z]/.test(src[j] || '')) j++;
      pushWord(src.slice(i,j)); i = j; continue;
    }
    if(ch === '{' || ch === '}'){ toks.push({t: ch === '{' ? '(' : ')'}); i++; continue; }
    if('+-*/^()|[]'.includes(ch)){ toks.push({t:ch}); i++; continue; }
    if(ch === '−'){ toks.push({t:'-'}); i++; continue; }
    if(ch === '·' || ch === '×'){ toks.push({t:'*'}); i++; continue; }
    if(ch === '√'){ toks.push({t:'sqrt'}); i++; continue; }
    if(ch === 'π'){ toks.push({t:'num', v:Math.PI}); i++; continue; }
    throw new Error('תו לא מוכר: ' + ch);
  }
  return toks;
  function pushWord(w){
    // מילה: שמות פונקציות, או אותיות בודדות (x, t, e)
    let k = 0;
    while(k < w.length){
      const rest = w.slice(k);
      const fn = Object.keys(FUNCS).sort((a,b) => b.length - a.length).find(n => rest.startsWith(n));
      if(fn){ toks.push({t: fn === 'sqrt' ? 'sqrt' : 'fn', v:fn}); k += fn.length; continue; }
      if(rest.startsWith('pi')){ toks.push({t:'num', v:Math.PI}); k += 2; continue; }
      const c = w[k];
      if(c === 'x' || c === 't') toks.push({t:'var'});
      else if(c === 'e') toks.push({t:'num', v:Math.E});
      else throw new Error('משתנה לא מוכר: ' + c + ' (השתמשו ב־x)');
      k++;
    }
  }
}
function parseExpr(src){
  const toks = tokenize(src); let p = 0, absDepth = 0;
  const peek = () => toks[p], next = () => toks[p++];
  const expect = t => { const k = next(); if(!k || k.t !== t) throw new Error('חסר ' + (t === ')' ? 'סוגר' : t)); };
  function expr(){
    let node = term();
    while(peek() && (peek().t === '+' || peek().t === '-')){
      const op = next().t, r = term(), l = node;
      node = op === '+' ? (x => l(x) + r(x)) : (x => l(x) - r(x));
    }
    return node;
  }
  function startsPrimary(k){
    if(!k) return false;
    if(k.t === '|') return absDepth === 0;
    return ['num','var','(','fn','frac','sqrt'].includes(k.t);
  }
  function term(){
    let node = unary();
    for(;;){
      const k = peek();
      if(k && (k.t === '*' || k.t === '/')){
        next(); const r = unary(), l = node;
        node = k.t === '*' ? (x => l(x) * r(x)) : (x => l(x) / r(x));
      } else if(startsPrimary(k)){
        const r = power(), l = node; node = x => l(x) * r(x);
      } else break;
    }
    return node;
  }
  function unary(){
    const k = peek();
    if(k && k.t === '-'){ next(); const u = unary(); return x => -u(x); }
    if(k && k.t === '+'){ next(); return unary(); }
    return power();
  }
  function exponent(){
    const k = peek();
    if(k && k.t === '('){ return group(); }
    if(k && k.t === '-'){ next(); const e = exponent(); return x => -e(x); }
    return primary();
  }
  function power(){
    const base = primary();
    if(peek() && peek().t === '^'){
      next(); const e = exponent();
      return x => powSafe(base(x), e(x));
    }
    return base;
  }
  function group(){
    expect('('); const e = expr(); expect(')'); return e;
  }
  function argument(){
    // ארגומנט של פונקציה: בסוגריים, או גורם אחד (sin x, sin 2x → sin(2x) לא נתמך; עדיף סוגריים)
    const k = peek();
    if(k && k.t === '(') return power0(group());
    return power();
  }
  function power0(g){
    if(peek() && peek().t === '^'){ next(); const e = exponent(); return x => powSafe(g(x), e(x)); }
    return g;
  }
  function primary(){
    const k = next();
    if(!k) throw new Error('הביטוי נגמר באמצע');
    switch(k.t){
      case 'num': return () => k.v;
      case 'var': return x => x;
      case '(': { const e = expr(); expect(')'); return e; }
      case '[': { const e = expr(); expect(']'); return e; }
      case '|': { absDepth++; const e = expr(); absDepth--; expect('|'); return x => Math.abs(e(x)); }
      case 'frac': { const a = group(), b = group(); return x => a(x) / b(x); }
      case 'sqrt': {
        if(peek() && peek().t === '['){
          next(); const n = expr(); expect(']'); const a = peek() && peek().t === '(' ? group() : primary();
          return x => nthRoot(a(x), n(x));
        }
        const a = peek() && peek().t === '(' ? group() : primary();
        return x => Math.sqrt(a(x));
      }
      case 'fn': {
        const fn = FUNCS[k.v];
        let pw = null;
        if(peek() && peek().t === '^'){ next(); pw = exponent(); }   // sin^2 x
        const a = argument();
        return pw ? (x => powSafe(fn(a(x)), pw(x))) : (x => fn(a(x)));
      }
    }
    throw new Error('לא הצלחתי לקרוא את הביטוי');
  }
  if(!toks.length) throw new Error('כתבו ביטוי');
  const f = expr();
  if(p < toks.length) throw new Error('יש משהו מיותר בסוף הביטוי');
  return f;
}
function powSafe(b, e){
  if(b < 0 && !Number.isInteger(e)){
    // שורש אי־זוגי של מספר שלילי, למשל x^(1/3)
    const inv = 1/e, n = Math.round(inv);
    if(Math.abs(inv - n) < 1e-9 && n % 2 !== 0) return -Math.pow(-b, e);
    return NaN;
  }
  return Math.pow(b, e);
}
function nthRoot(v, n){
  if(v < 0 && Math.round(n) % 2 === 1) return -Math.pow(-v, 1/n);
  return Math.pow(v, 1/n);
}
/* בדיקה האם הפונקציה היא פולינום (עד מעלה 7), ואם כן – המקדמים שלו */
function asPolynomial(f){
  const n = 8, X = [], Y = [];
  for(let k=0;k<n;k++){ const x = -2 + k*4/(n-1); const y = f(x); if(!isFinite(y)) return null; X.push(x); Y.push(y); }
  // מערכת ונדרמונד
  const A = X.map((x,r) => [...Array(n)].map((_,c) => x**c).concat(Y[r]));
  for(let c=0;c<n;c++){
    let piv = c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
    [A[c], A[piv]] = [A[piv], A[c]];
    for(let r=0;r<n;r++) if(r !== c){ const m = A[r][c]/A[c][c]; for(let k=c;k<=n;k++) A[r][k] -= m*A[c][k]; }
  }
  const coef = A.map((row,i) => row[n]/row[i]).map(v => Math.abs(v) < 1e-9 ? 0 : v);
  for(const x of [-2.73, -1.37, 0.41, 1.93, 2.71, 3.6]){
    const want = f(x), got = coef.reduce((s,c,k) => s + c*x**k, 0);
    if(!isFinite(want) || Math.abs(want-got) > 1e-7*(1+Math.abs(want))) return null;
  }
  // ניקוי מקדמים שהם כמעט שבר פשוט
  return coef.map(v => { for(let d=1; d<=24; d++){ const q = Math.round(v*d); if(Math.abs(v*d-q) < 1e-7) return q/d; } return v; });
}

/* ===== פונקציות לדוגמה =====
   pieces: פונקציה (מקוטעת) של פולינומים. c = מקדמים בסדר עולה: [c0, c1, c2, ...]
   to = הקצה הימני של הקטע. conds = התנאים לתצוגת הנוסחה של F.
   input = מה שמוצג בשדה ההקלדה. free: האם מותר לשנות את הטווח. */
const INF = Infinity, DEFAULT_DOM = [-5, 5];
const PRESETS = [
  { id:'line', name:'קו ישר', input:'x-2', tex:String.raw`f(t)=t-2`, dom:[-1,6], free:true, a:0, x:3,
    pieces:[{ to:INF, c:[-2,1] }] },
  { id:'zigzag', name:'קו שבור', input:'', dom:[0,8], free:false, a:0, x:3,
    tex:String.raw`f(t)=\begin{cases}2t-2 & 0\le t\le 2\\ -t+4 & 2<t\le 6\\ 2t-14 & 6<t\le 8\end{cases}`,
    pieces:[{ to:2, c:[-2,2] }, { to:6, c:[4,-1] }, { to:INF, c:[-14,2] }],
    conds:[String.raw`0\le x\le 2`, String.raw`2<x\le 6`, String.raw`6<x\le 8`] },
  { id:'semi', name:'חצאי עיגול', input:'', dom:[0,8], free:false, a:0, x:3,
    tex:String.raw`f(t)=\begin{cases}\sqrt{4-(t-2)^2} & 0\le t\le 4\\ -\sqrt{4-(t-6)^2} & 4<t\le 8\end{cases}`,
    f:t => t<=4 ? Math.sqrt(Math.max(0,4-(t-2)**2)) : -Math.sqrt(Math.max(0,4-(t-6)**2)) },
  { id:'para', name:'פרבולה', input:'x^2-4x+3', tex:String.raw`f(t)=t^2-4t+3`, dom:[-1,5], free:true, a:0, x:2,
    pieces:[{ to:INF, c:[3,-4,1] }] },
  { id:'cubic', name:'פולינום ממעלה 3', input:String.raw`\frac{1}{2}(x+2)(x-1)(x-3)`, tex:String.raw`f(t)=\tfrac{1}{2}(t+2)(t-1)(t-3)`, dom:[-2.5,3.5], free:true, a:-2, x:0,
    pieces:[{ to:INF, c:[3,-2.5,-1,0.5] }] },
  { id:'sin', name:'סינוס', input:String.raw`\sin(x)`, tex:String.raw`f(t)=\sin t`, dom:[0,12.5], free:true, a:0, x:4,
    f:Math.sin, G:t => -Math.cos(t), sin:true },
];

const $ = s => document.querySelector(s);
const S = { p:null, dom:[0,1], a:0, x:0, full:true, strip:false, marks:false, playing:false, drag:null };
let G = {};
const SC = {};

/* ===== עזרים ===== */
const clamp = (v,lo,hi) => Math.min(hi, Math.max(lo, v));
const fin = v => isFinite(v) ? v : 0;
function fmt(v, d=2){
  if(!isFinite(v)) return '—';
  if(Math.abs(v) < 0.5*10**-d) return '0';
  return v.toFixed(d).replace(/\.?0+$/,'');
}
const dm = s => s.replace('-', '−');
function simpson(g, a, b, n=800){
  if(a === b) return 0;
  const h = (b-a)/n; let s = fin(g(a)) + fin(g(b));
  for(let i=1;i<n;i++) s += (i%2 ? 4 : 2) * fin(g(a+i*h));
  return s*h/3;
}
function niceStep(range, target){
  const raw = range/target, p = 10**Math.floor(Math.log10(raw)), m = raw/p;
  return (m<1.5 ? 1 : m<3 ? 2 : m<7 ? 5 : 10) * p;
}
function ticks(lo, hi, target){
  const st = niceStep(hi-lo, target), out = [];
  for(let v = Math.ceil(lo/st)*st; v <= hi+1e-9; v += st) out.push(+v.toFixed(10));
  return out;
}
function snap(v){
  v = Math.round(v/0.05)*0.05;
  if(Math.abs(v - Math.round(v)) < 0.08) v = Math.round(v);
  return +v.toFixed(2);
}
const polyEval = (c,t) => { let s = 0; for(let k=c.length-1;k>=0;k--) s = s*t + c[k]; return s; };

/* ===== כתיבה ב-LaTeX: שברים, פולינומים והצבה ===== */
function num(v){
  for(let d=1; d<=24; d++){
    const n = Math.round(v*d);
    if(Math.abs(v*d - n) < 1e-7) return d === 1 ? `${n}` : String.raw`\tfrac{${n}}{${d}}`;
  }
  return fmt(v);
}
function polyTex(c, v='x'){
  let s = '';
  for(let k=c.length-1;k>=0;k--){
    const a = c[k]; if(Math.abs(a) < 1e-9) continue;
    const A = Math.abs(a), coef = (k>0 && Math.abs(A-1) < 1e-9) ? '' : num(A);
    const pow = k === 0 ? '' : (k === 1 ? v : `${v}^{${k}}`);
    s += (s ? (a<0 ? '-' : '+') : (a<0 ? '-' : '')) + coef + pow;
  }
  return s || '0';
}
function substTex(c, x){
  if(Math.abs(x) < 1e-9){ const k0 = c[0]; return Math.abs(k0) < 1e-9 ? '0' : (k0 < 0 ? '-' : '') + num(Math.abs(k0)); }
  const xs = x < 0 ? `(${fmt(x)})` : fmt(x);
  let s = '';
  for(let k=c.length-1;k>=0;k--){
    const a = c[k]; if(Math.abs(a) < 1e-9) continue;
    const A = Math.abs(a), one = Math.abs(A-1) < 1e-9;
    const base = k === 0 ? '' : (k === 1 ? xs : `${xs}^{${k}}`);
    const term = k === 0 ? num(A) : (one ? base : `${num(A)}\\cdot ${base}`);
    s += (s ? (a<0 ? '-' : '+') : (a<0 ? '-' : '')) + term;
  }
  return s || '0';
}
function constTex(c){ return Math.abs(c) < 5e-3 ? '' : (c < 0 ? '-' : '+') + num(Math.abs(c)); }

/* ===== פונקציה מקוטעת של פולינומים: f ופונקציה קדומה רציפה G ===== */
function prep(p){
  if(!p.pieces || p.ready) return;
  p.pieces.forEach((pc,i) => {
    const I = [0, ...pc.c.map((v,k) => v/(k+1))];
    if(i > 0){ const b = p.pieces[i-1].to; I[0] = polyEval(p.pieces[i-1].I, b) - polyEval(I, b); }
    pc.I = I;
  });
  p.pick = t => p.pieces.find(pc => t <= pc.to) || p.pieces[p.pieces.length-1];
  if(!p.f) p.f = t => polyEval(p.pick(t).c, t);
  p.G = t => polyEval(p.pick(t).I, t);
  p.ready = true;
}

/* ===== חישוב מוקדם על הטווח הנוכחי ===== */
function compute(){
  const f = S.p.f, [x0,x1] = S.dom, N = 3000, h = (x1-x0)/N;
  const ts = new Float64Array(N+1), fs = new Float64Array(N+1), C = new Float64Array(N+1);
  const vals = [];
  for(let i=0;i<=N;i++){
    ts[i] = x0 + i*h; fs[i] = f(ts[i]);
    if(isFinite(fs[i])) vals.push(fs[i]);
    if(i>0) C[i] = C[i-1] + ((isFinite(fs[i-1]) && isFinite(fs[i])) ? (fs[i-1]+fs[i])*h/2 : 0);
  }
  G = { ts, fs, C, N, h, x0, x1, xr:[x0-(x1-x0)*0.03, x1+(x1-x0)*0.03] };
  G.fy = yRange(vals);

  const fmin = vals.length ? Math.min(...vals) : 0, fmax = vals.length ? Math.max(...vals) : 1;
  const scale = (fmax-fmin) || 1;
  G.roots = signChanges(i => fs[i], i => ts[i], N+1, 1e-9*scale).map(o => ({ t:o.t, kind: o.from > 0 ? 'max' : 'min' }));
  const ext = signChanges(i => fs[i+1]-fs[i], i => ts[i]+h/2, N, 1e-12*scale).map(o => ({ t:o.t, kind:'infl' }));
  G.feats = G.roots.concat(ext).filter(o => o.t > x0+3*h && o.t < x1-3*h && isFinite(f(o.t)));
}
/* טווח y אוטומטי: כולל את 0, ומתעלם מקפיצות קיצוניות (למשל ליד אסימפטוטה) */
function yRange(vals){
  if(!vals.length) return [-1,1];
  const s = Float64Array.from(vals).sort(), q = p => s[Math.min(s.length-1, Math.floor(p*(s.length-1)))];
  let lo = s[0], hi = s[s.length-1];
  const core = q(0.98) - q(0.02);
  if(core > 0 && hi - lo > 8*core){ lo = q(0.01); hi = q(0.99); }
  lo = Math.min(0, lo); hi = Math.max(0, hi);
  const pd = (hi-lo)*0.12 || 1;
  return [lo-pd, hi+pd];
}
function signChanges(val, pos, n, eps){
  const res = []; let lastI = -1, lastS = 0;
  for(let i=0;i<n;i++){
    const v = val(i), s = v > eps ? 1 : (v < -eps ? -1 : 0);
    if(!s){ if(!isFinite(v)) lastS = 0; continue; }
    if(lastS && s !== lastS){
      let t;
      if(i - lastI === 1){ const v0 = val(lastI); t = pos(lastI) + (pos(i)-pos(lastI)) * v0/(v0 - v); }
      else t = (pos(lastI+1) + pos(i-1)) / 2;
      res.push({ t, from:lastS });
    }
    lastS = s; lastI = i;
  }
  return res;
}
function interpC(t){
  const u = clamp((t-G.x0)/G.h, 0, G.N), i = Math.min(Math.floor(u), G.N-1), r = u - i;
  return G.C[i]*(1-r) + G.C[i+1]*r;
}
function gridPts(lo, hi, valAt){
  const pts = [[lo, valAt(lo, -1)]];
  const i0 = Math.ceil((lo-G.x0)/G.h + 1e-9), i1 = Math.floor((hi-G.x0)/G.h - 1e-9);
  for(let i=i0;i<=i1;i++) pts.push([G.ts[i], valAt(G.ts[i], i)]);
  pts.push([hi, valAt(hi, -1)]);
  return pts;
}

/* ===== הערכים הנוכחיים ===== */
function values(){
  const f = S.p.f, a = S.a, x = S.x, lo = Math.min(a,x), hi = Math.max(a,x);
  let undef = !isFinite(f(lo)) || !isFinite(f(hi));
  const i0 = Math.ceil((lo-G.x0)/G.h), i1 = Math.floor((hi-G.x0)/G.h);
  for(let i=Math.max(0,i0); i<=Math.min(G.N,i1) && !undef; i++) if(!isFinite(G.fs[i])) undef = true;
  const pieces = [];
  if(hi - lo > 1e-9 && !undef){
    let cuts = [lo, ...G.roots.map(r => r.t).filter(t => t > lo+1e-6 && t < hi-1e-6), hi];
    if(x < a) cuts.reverse();
    for(let i=0;i<cuts.length-1;i++){
      const v = simpson(f, cuts[i], cuts[i+1]);
      if(Math.abs(v) >= 5e-3) pieces.push(v);
    }
  }
  const F = pieces.reduce((s,v) => s+v, 0);
  return { pieces, F, fx: f(x), fwd: x >= a, undef };
}

/* ===== ציור ===== */
function makeScale(W, H, xr, yr){
  const pad = { l:44, r:18, t:18, b:26 };
  const kx = (W-pad.l-pad.r)/(xr[1]-xr[0]), ky = (H-pad.t-pad.b)/(yr[1]-yr[0]);
  return { W, H, pad, xr, yr, kx, ky,
    sx: t => pad.l + (t-xr[0])*kx, sy: y => pad.t + (yr[1]-y)*ky, ix: px => xr[0] + (px-pad.l)/kx };
}
const n2 = v => v.toFixed(1);
function axes(sc, xname, yname){
  const { W, H, pad, sx, sy, xr, yr } = sc;
  let s = '';
  const xt = ticks(xr[0], xr[1], Math.max(4, Math.round((W-60)/85)));
  const yt = ticks(yr[0], yr[1], Math.max(2, Math.round((H-40)/45)));
  for(const v of xt) s += `<line class="gl" x1="${n2(sx(v))}" y1="${pad.t}" x2="${n2(sx(v))}" y2="${H-pad.b}"/>`;
  for(const v of yt) s += `<line class="gl" x1="${pad.l}" y1="${n2(sy(v))}" x2="${W-pad.r}" y2="${n2(sy(v))}"/>`;
  const y0 = sy(0), yax = (xr[0] <= 0 && xr[1] >= 0) ? sx(0) : pad.l;
  s += `<line class="axis" x1="${pad.l}" y1="${n2(y0)}" x2="${W-pad.r}" y2="${n2(y0)}"/>`;
  s += `<line class="axis" x1="${n2(yax)}" y1="${pad.t}" x2="${n2(yax)}" y2="${H-pad.b}"/>`;
  for(const v of xt){
    if(v === 0 && yax === sx(0)){ s += `<text class="tick" x="${n2(sx(0)-5)}" y="${n2(y0+18)}" text-anchor="end">0</text>`; continue; }
    s += `<text class="tick" x="${n2(sx(v))}" y="${n2(y0+18)}" text-anchor="middle">${dm(fmt(v))}</text>`;
  }
  for(const v of yt){ if(v !== 0) s += `<text class="tick" x="${n2(yax-6)}" y="${n2(sy(v)+4)}" text-anchor="end">${dm(fmt(v))}</text>`; }
  s += `<text class="axname tick" x="${W-pad.r-2}" y="${n2(y0-7)}" text-anchor="end">${xname}</text>`;
  s += `<text class="axname tick" x="${n2(yax+7)}" y="${pad.t+12}">${yname}</text>`;
  return s;
}
function clipDef(id, sc){
  return `<defs><clipPath id="${id}"><rect x="${sc.pad.l}" y="${sc.pad.t}" width="${n2(sc.W-sc.pad.l-sc.pad.r)}" height="${n2(sc.H-sc.pad.t-sc.pad.b)}"/></clipPath></defs>`;
}
function pathFrom(pts, sc){
  let d = '', pen = false;
  for(const [t,y] of pts){
    if(!isFinite(y)){ pen = false; continue; }
    d += (pen ? 'L' : 'M') + n2(sc.sx(t)) + ' ' + n2(sc.sy(clamp(y, sc.yr[0]-1e3*(sc.yr[1]-sc.yr[0]), sc.yr[1]+1e3*(sc.yr[1]-sc.yr[0]))));
    pen = true;
  }
  return d;
}
function areaPath(pts, g, sc){
  let d = `M${n2(sc.sx(pts[0][0]))} ${n2(sc.sy(0))}`;
  for(const [t,y] of pts) d += `L${n2(sc.sx(t))} ${n2(sc.sy(clamp(g(fin(y)), sc.yr[0]-1, sc.yr[1]+1)))}`;
  return d + `L${n2(sc.sx(pts[pts.length-1][0]))} ${n2(sc.sy(0))}Z`;
}
function sizeSvg(svg){
  const box = svg.parentElement;
  const W = Math.max(280, box.clientWidth || 600), H = Math.max(110, box.clientHeight || 250);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  return [W, H];
}
function marker(kind, X, Y, color){
  if(kind === 'infl')
    return `<rect x="${n2(X-5)}" y="${n2(Y-5)}" width="10" height="10" transform="rotate(45 ${n2(X)} ${n2(Y)})" fill="#fff" stroke="${color}" stroke-width="2"/>`;
  return `<circle cx="${n2(X)}" cy="${n2(Y)}" r="5.5" fill="${kind === 'root' ? '#fff' : color}" stroke="${color}" stroke-width="2"/>`;
}

function drawTop(V){
  const svg = $('#pf'), [W,H] = sizeSvg(svg);
  const sc = SC.f = makeScale(W, H, G.xr, G.fy);
  const { a, x } = S, f = S.p.f;
  let s = clipDef('clipF1', sc) + axes(sc, 't', 'y') + '<g clip-path="url(#clipF1)">';

  if(Math.abs(x-a) > 1e-9 && !V.undef){
    const pts = gridPts(Math.min(a,x), Math.max(a,x), (t,i) => i >= 0 ? G.fs[i] : f(t));
    s += `<path d="${areaPath(pts, y => Math.max(y,0), sc)}" class="${V.fwd ? 'addA' : 'subA'}"/>`;
    s += `<path d="${areaPath(pts, y => Math.min(y,0), sc)}" class="${V.fwd ? 'subA' : 'addA'}"/>`;
  }
  if(S.strip && isFinite(V.fx)){
    const dx = (G.x1-G.x0)/30; let s0 = x, s1 = x+dx;
    if(s1 > G.x1){ s0 = x-dx; s1 = x; }
    const yA = sc.sy(0), yB = sc.sy(V.fx);
    s += `<rect class="strip" x="${n2(sc.sx(s0))}" y="${n2(Math.min(yA,yB))}" width="${n2(sc.sx(s1)-sc.sx(s0))}" height="${n2(Math.abs(yA-yB))}"/>`;
  }
  if(S.marks){
    for(const o of G.feats){
      const X = sc.sx(o.t);
      s += `<line class="featl" x1="${n2(X)}" y1="${sc.pad.t}" x2="${n2(X)}" y2="${H-sc.pad.b}"/>`;
      s += o.kind === 'infl' ? marker('infl', X, sc.sy(f(o.t)), 'var(--f)') : marker('root', X, sc.sy(0), 'var(--f)');
    }
  }
  s += `<path class="fcurve" d="${pathFrom(Array.from(G.ts, (t,i) => [t, G.fs[i]]), sc)}"/></g>`;
  const X = sc.sx(x);
  s += `<line class="xline" x1="${n2(X)}" y1="${sc.pad.t}" x2="${n2(X)}" y2="${H-sc.pad.b}"/>`;
  if(isFinite(V.fx) && V.fx >= sc.yr[0] && V.fx <= sc.yr[1])
    s += `<circle cx="${n2(X)}" cy="${n2(sc.sy(V.fx))}" r="5.5" fill="var(--ink)" stroke="#fff" stroke-width="2"/>`;
  const lab = 'x = ' + dm(fmt(x)), lw = lab.length*7 + 14, lx = clamp(X - lw/2, sc.pad.l, W - sc.pad.r - lw);
  s += `<rect x="${n2(lx)}" y="0" width="${lw}" height="20" rx="10" fill="var(--ink)"/>`;
  s += `<text x="${n2(lx+lw/2)}" y="14" text-anchor="middle" style="fill:#fff;font-weight:600">${lab}</text>`;
  const A = sc.sx(a), A0 = sc.sy(0);
  s += `<circle cx="${n2(A)}" cy="${n2(A0)}" r="9" fill="var(--a)" stroke="#fff" stroke-width="2" style="cursor:grab"/>`;
  s += `<text x="${n2(A)}" y="${n2(A0+4)}" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:12px;pointer-events:none">a</text>`;
  svg.innerHTML = s;
}

function drawBottom(V){
  const svg = $('#pF'), [W,H] = sizeSvg(svg);
  const Ca = interpC(S.a);
  let mn = 0, mx = 0;
  for(let i=0;i<=G.N;i++){ const v = G.C[i]-Ca; if(v<mn) mn = v; if(v>mx) mx = v; }
  const pd = (mx-mn)*0.12 || 1;
  const sc = SC.F = makeScale(W, H, G.xr, [mn-pd, mx+pd]);
  const { a, x } = S;
  let s = clipDef('clipF2', sc) + axes(sc, 'x', 'y');

  if(S.marks){
    for(const o of G.feats){
      const X = sc.sx(o.t);
      s += `<line class="featl" x1="${n2(X)}" y1="${sc.pad.t}" x2="${n2(X)}" y2="${H-sc.pad.b}"/>`;
      s += marker(o.kind === 'infl' ? 'infl' : 'ext', X, sc.sy(interpC(o.t)-Ca), 'var(--F)');
    }
  }
  s += '<g clip-path="url(#clipF2)">';
  if(S.full) s += `<path class="Ffull" d="${pathFrom(Array.from(G.ts, (t,i) => [t, G.C[i]-Ca]), sc)}"/>`;
  if(Math.abs(x-a) > 1e-9 && !V.undef){
    const pts = gridPts(Math.min(a,x), Math.max(a,x), (t,i) => (i >= 0 ? G.C[i] : interpC(t)) - Ca);
    s += `<path class="Ftrace" d="${pathFrom(pts, sc)}"/>`;
  }
  s += '</g>';
  const X = sc.sx(x), Y = sc.sy(V.undef ? interpC(x)-Ca : V.F);
  s += `<line class="xline" x1="${n2(X)}" y1="${sc.pad.t}" x2="${n2(X)}" y2="${H-sc.pad.b}"/>`;
  if(S.strip && isFinite(V.fx) && !V.undef){
    let ux = sc.kx, uy = -V.fx*sc.ky; const L = Math.hypot(ux,uy); ux = ux/L*80; uy = uy/L*80;
    s += `<line class="tan" x1="${n2(X-ux)}" y1="${n2(Y-uy)}" x2="${n2(X+ux)}" y2="${n2(Y+uy)}"/>`;
  }
  const A = sc.sx(a), A0 = sc.sy(0);
  s += `<circle cx="${n2(A)}" cy="${n2(A0)}" r="7" fill="#fff" stroke="var(--a)" stroke-width="3" style="cursor:grab"/>`;
  if(!V.undef){
    s += `<circle cx="${n2(X)}" cy="${n2(Y)}" r="6.5" fill="var(--F)" stroke="#fff" stroke-width="2"/>`;
    const lab = 'F(x) = ' + dm(fmt(V.F)), right = X + 14 + lab.length*7.5 < W - sc.pad.r;
    s += `<text class="tick" x="${n2(right ? X+12 : X-12)}" y="${n2(Y + (Y < sc.pad.t+24 ? 20 : -10))}" text-anchor="${right ? 'start' : 'end'}" style="fill:var(--F);font-weight:700;font-size:13px">${lab}</text>`;
  }
  svg.innerHTML = s;
}

/* ===== נוסחאות וחישוב ===== */
function tex(el, src){
  if(window.katex){ try{ katex.render(src, el, { throwOnError:false }); return; }catch(e){} }
  el.textContent = src;
}
/* מקטין את הגופן עד שהנוסחה נכנסת בשורה אחת (ובגובה המותר) */
function fit(el, base, min=0.62, maxH=Infinity){
  let s = base; el.style.fontSize = s + 'rem';
  const box = () => {
    const k = el.querySelector('.katex-html');
    if(!k) return { width:el.scrollWidth, height:el.scrollHeight };
    let top = Infinity, bottom = -Infinity;
    for(const b of k.querySelectorAll('.base')){ const r = b.getBoundingClientRect(); top = Math.min(top, r.top); bottom = Math.max(bottom, r.bottom); }
    return { width:k.getBoundingClientRect().width, height: bottom > top ? bottom - top : 0 };
  };
  for(let r = box(); (r.width > el.clientWidth + 1 || r.height > maxH) && s > min; r = box()){
    s -= 0.04; el.style.fontSize = s + 'rem';
  }
}
function FformulaTex(){
  const p = S.p, head = String.raw`F(x)=\int_{${fmt(S.a)}}^{x} f(t)\,dt`;
  if(p.pieces){
    const Ga = p.G(S.a);
    const sh = pc => polyTex([pc.I[0]-Ga, ...pc.I.slice(1)]);
    if(p.pieces.length === 1) return head + '=' + sh(p.pieces[0]);
    return head + String.raw`=\begin{cases}` + p.pieces.map((pc,i) => sh(pc) + ' & ' + p.conds[i]).join(String.raw`\\`) + String.raw`\end{cases}`;
  }
  if(p.sin) return head + String.raw`=-\cos x` + constTex(Math.cos(S.a));
  return head;
}
function formulaCalcTex(V){
  const p = S.p, xs = fmt(S.x);
  if(p.pieces){
    const pc = p.pick(S.x), Ga = p.G(S.a);
    return substTex([pc.I[0]-Ga, ...pc.I.slice(1)], S.x) + '=' + fmt(V.F);
  }
  if(p.sin) return `-\\cos(${xs})` + constTex(Math.cos(S.a)) + '=' + fmt(V.F);
  return null;
}
function areaCalcTex(V){
  if(!V.pieces.length) return '0';
  const terms = V.pieces.map(v => v >= 0
    ? `\\textcolor{#1E9E6A}{${fmt(v)}}`
    : `\\textcolor{#D2414E}{(${fmt(v)})}`);
  return terms.join('+') + (V.pieces.length > 1 ? '=' + fmt(V.F) : '');
}
function sideText(V){
  const xa = fmt(S.a), xx = fmt(S.x);
  const ft = V.undef ? null : formulaCalcTex(V);
  $('#formulaCard').style.display = ft ? '' : 'none';   // קודם קובעים את רוחב הכרטיסים, ואז מתאימים גופן
  tex($('#FTex'), FformulaTex()); fit($("#FTex"), 1.15, 0.7, 60);
  tex($('#cMain'), V.undef
    ? String.raw`F(${xx})=\text{?}`
    : String.raw`F(${xx})=\textcolor{#8A3FA0}{\mathbf{${fmt(V.F)}}}`);
  fit($('#cMain'), 1.5);
  if(V.undef) $('#cArea').textContent = '—';
  else { tex($('#cArea'), areaCalcTex(V)); fit($('#cArea'), 1.35); }
  if(ft){ tex($('#cFormula'), ft); fit($('#cFormula'), 1.3); }
  tex($('#cRel'), isFinite(V.fx) ? `F'(${xx})=f(${xx})=${fmt(V.fx)}` : `f(${xx})\\ \\text{לא מוגדר}`);
  fit($('#cRel'), 1.35);
  $('#note').textContent = V.undef ? 'f לא מוגדרת בחלק מהקטע'
    : (S.x < S.a - 1e-9 ? 'x < a: שטח מעל הציר מחסיר' : '');
}

/* ===== עדכון ===== */
function render(){
  const V = values();
  drawTop(V); drawBottom(V); sideText(V);
  $('#xs').value = S.x; $('#as').value = S.a;
  $('#xv').textContent = dm(fmt(S.x)); $('#av').textContent = dm(fmt(S.a));
  $('#a0').disabled = !(S.dom[0] <= 0 && S.dom[1] >= 0);
}
function applyDomain(lo, hi){
  S.dom = [lo, hi];
  S.a = clamp(S.a, lo, hi); S.x = clamp(S.x, lo, hi);
  for(const id of ['#xs','#as']){ const el = $(id); el.min = lo; el.max = hi; el.step = 0.05; }
  $('#dMin').value = lo; $('#dMax').value = hi;
  compute(); render();
}
function onDomainInput(){
  let lo = parseFloat($('#dMin').value), hi = parseFloat($('#dMax').value);
  if(!isFinite(lo) || !isFinite(hi)){ $('#dMin').value = S.dom[0]; $('#dMax').value = S.dom[1]; return; }
  if(hi < lo) [lo, hi] = [hi, lo];
  if(hi - lo < 1) hi = lo + 1;
  if(hi - lo > 60) hi = lo + 60;
  applyDomain(lo, hi);
}
/* החלק הרציף הארוך ביותר בטווח שבו f מוגדרת */
function definedPart(f, lo, hi){
  const N = 2000, h = (hi-lo)/N; let best = null, start = null;
  for(let i=0;i<=N+1;i++){
    const ok = i <= N && isFinite(f(lo + i*h));
    if(ok && start === null) start = i;
    if(!ok && start !== null){ if(!best || i-1-start > best[1]-best[0]) best = [start, i-1]; start = null; }
  }
  if(!best || best[1] - best[0] < 20) return null;
  let a = Math.round((lo + best[0]*h)*10)/10, b = Math.round((lo + best[1]*h)*10)/10;
  while(!isFinite(f(a)) && a < b) a = +(a+0.1).toFixed(1);
  while(!isFinite(f(b)) && b > a) b = +(b-0.1).toFixed(1);
  return b - a >= 0.5 ? [a, b] : null;
}
function fitGraph(){
  const p = S.p; if(!p.free) return;
  const base = p.id === 'custom' ? DEFAULT_DOM : p.dom;
  const d = definedPart(p.f, base[0], base[1]);
  if(d) applyDomain(d[0], d[1]);
}
function setPreset(p){
  stop(); prep(p);
  S.p = p; S.a = p.a; S.x = p.x;
  $('#ex').value = p.id;
  setField(p.input || '');
  $('#err').textContent = '';
  tex($('#fTex'), p.tex); fit($("#fTex"), 1.15, 0.7, 60);
  $('#dMin').disabled = $('#dMax').disabled = $('#fit').disabled = !p.free;
  applyDomain(p.dom[0], p.dom[1]);
}

/* ===== פונקציה שהמורה או התלמיד מקלידים ===== */
function getField(){ const el = $('#mf'); return (el.value || '').trim(); }
function setField(v){ const el = $('#mf'); el.value = v; }
function showCustom(){
  const src = getField();
  let f;
  try{ f = parseExpr(src); f(1); }
  catch(e){ $('#err').textContent = e.message; return; }
  const d = definedPart(f, DEFAULT_DOM[0], DEFAULT_DOM[1]) || definedPart(f, -10, 10);
  if(!d){ $('#err').textContent = 'הפונקציה לא מוגדרת בטווח הזה'; return; }
  $('#err').textContent = '';
  stop();
  const disp = src.replace(/\\[a-zA-Z]+|x/g, m => m === 'x' ? 't' : m);
  const p = { id:'custom', name:'פונקציה משלי', input:src, tex:'f(t)=' + disp, free:true, dom:d, f };
  const coefs = asPolynomial(f);
  if(coefs) p.pieces = [{ to:INF, c:coefs }];
  prep(p);
  const a = clamp(0, d[0], d[1]);
  S.p = p; S.a = a; S.x = clamp(snap(a + (d[1]-d[0])/4), d[0], d[1]);
  $('#ex').value = 'custom';
  tex($('#fTex'), p.tex); fit($("#fTex"), 1.15, 0.7, 60);
  $('#dMin').disabled = $('#dMax').disabled = $('#fit').disabled = false;
  applyDomain(d[0], d[1]);
}

/* ===== הנפשה ===== */
function stop(){ S.playing = false; $('#play').textContent = '▶ הפעל צבירה'; }
function play(){
  if(S.playing){ stop(); return; }
  const x1 = G.x1; if(S.a >= x1 - 1e-6) return;
  S.x = S.a; S.playing = true; $('#play').textContent = '❚❚ עצירה';
  const speed = (G.x1 - G.x0)/6; let last = null;
  const step = ts => {
    if(!S.playing) return;
    if(last === null) last = ts;
    S.x = Math.min(x1, S.x + speed*(ts-last)/1000); last = ts;
    render();
    if(S.x >= x1){ stop(); return; }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ===== גרירה ===== */
function attach(svg, key){
  const local = e => { const r = svg.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const move = e => { const [px] = local(e); S[S.drag] = clamp(snap(SC[key].ix(px)), G.x0, G.x1); render(); };
  svg.addEventListener('pointerdown', e => {
    const [px,py] = local(e), sc = SC[key];
    S.drag = (Math.abs(px - sc.sx(S.a)) < 16 && Math.abs(py - sc.sy(0)) < 16) ? 'a' : 'x';
    stop(); svg.setPointerCapture(e.pointerId); move(e); e.preventDefault();
  });
  svg.addEventListener('pointermove', e => { if(S.drag) move(e); });
  const end = () => { S.drag = null; };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
}
function toggle(id, key){
  $(id).addEventListener('click', e => {
    S[key] = !S[key]; e.currentTarget.setAttribute('aria-pressed', S[key]); render();
  });
}

/* ===== אתחול ===== */
function init(){
  // אם המקלדת המתמטית לא נטענה (למשל בלי אינטרנט) – שדה טקסט רגיל
  if(!customElements.get('math-field')){
    const inp = document.createElement('input');
    inp.id = 'mf'; inp.className = 'fx-fallback'; inp.dir = 'ltr'; inp.placeholder = 'x^2-4x+3';
    $('#mf').replaceWith(inp);
  }
  const sel = $('#ex');
  PRESETS.forEach(p => sel.add(new Option(p.name, p.id)));
  const own = new Option('פונקציה משלי', 'custom'); own.disabled = true; sel.add(own);
  sel.addEventListener('change', () => { const p = PRESETS.find(q => q.id === sel.value); if(p) setPreset(p); });

  $('#show').addEventListener('click', showCustom);
  $('#mf').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); showCustom(); } });
  $('#mf').addEventListener('input', () => { $('#err').textContent = ''; });

  $('#xs').addEventListener('input', e => { stop(); S.x = +e.target.value; render(); });
  $('#as').addEventListener('input', e => { stop(); S.a = +e.target.value; render(); });
  $('#a0').addEventListener('click', () => { stop(); S.a = 0; render(); });
  $('#dMin').addEventListener('change', onDomainInput);
  $('#dMax').addEventListener('change', onDomainInput);
  $('#fit').addEventListener('click', fitGraph);
  toggle('#tFull','full'); toggle('#tStrip','strip'); toggle('#tMarks','marks');
  $('#play').addEventListener('click', play);
  $('#reset').addEventListener('click', () => S.p.id === 'custom' ? showCustom() : setPreset(S.p));
  attach($('#pf'), 'f'); attach($('#pF'), 'F');
  new ResizeObserver(() => { if(S.p) render(); }).observe($('#graphs'));
  setPreset(PRESETS[3]);
}
window.addEventListener('load', init);
</script>
